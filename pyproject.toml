[project]
name = "site-bench-mcp"
version = "1.0.0"
description = "中转站质量评测 MCP：让 AI 直接测延迟 / 并发 / 参数兼容 / 降智抽样"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
site-bench-mcp = "site_bench_mcp:main"

[project.urls]
